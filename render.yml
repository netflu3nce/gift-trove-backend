services:
  - type: web
    name: gifttrove-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: STRING_SESSION
        sync: false
      - key: GETGEMS_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
